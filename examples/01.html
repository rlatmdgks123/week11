<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11주차 과제 · 함수 정의와 반환값 활용</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; padding: 16px; }
    .note { padding: 12px 16px; border-left: 4px solid #1b5e20; background: #e8f5e9; }
    .sandbox { margin: 16px 0; padding: 16px; border: 1px dashed #81c784; border-radius: 8px; }
    .sandbox h2 { font-size: 0.95rem; color: #2e7d32; margin: 0 0 10px; }
  </style>
</head>
<body>
  <p class="note">
    <strong>11주차 과제 · 함수 정의와 반환값 활용</strong><br>
    실행 결과는 브라우저 개발자도구(F12 또는 Ctrl+Shift+I / Mac: Cmd+Option+I)의 <strong>Console</strong> 탭에서 확인합니다.
  </p>

  <div class="sandbox">
    <h2>과제 테스트 영역 — 상품 주문 정보</h2>
    <h1 id="product-title">무선 기계식 키보드</h1>
    <p id="customer-name">고객명: 김민수</p>
    <p id="origin-price">정가: 89000원</p>
    <div class="status-box">배송 상태: 결제 대기</div>

    <ul id="option-list" class="list">
      <li>색상: 스페이스 그레이</li>
      <li>축 선택: 저소음 적축</li>
      <li>추가 구성: 전용 루프 커버</li>
    </ul>

    <form id="orderForm">
      <input type="text" name="coupon" placeholder="할인 쿠폰 코드 입력">
      <label><input type="checkbox" id="terms"> 주문 내역 확인 완료</label>
      <button type="button" id="submitBtn">주문하기</button>
    </form>
  </div>

  <script>
    /*
    11주차 과제 — 상품 할인 금액 계산 및 주문 메시지 출력 함수
    */

    // 1. return이 있는 함수: 정가와 할인 금액을 받아 최종 결제 금액을 반환
    function calcFinalPrice(price, discount) {   // price, discount = 매개변수(parameter)
      const finalAmount = price - discount;
      return finalAmount;                        // 계산된 결과를 호출한 곳으로 돌려줌
    }

    // 함수 호출 및 결과 저장
    const payAmount = calcFinalPrice(89000, 15000); // 89000, 15000 = 인자(argument)
    console.log(`최종 결제 금액: ${payAmount}원`);   // 74000원 출력


    // 2. return이 없는 함수: 콘솔에 안내 문구만 출력하고 값은 돌려주지 않음
    function notifyOrder(userName, item) {
      console.log(`[알림] ${userName}님의 '${item}' 주문이 접수되었습니다.`);
    }

    // 함수 호출 (반환값이 없으므로 변수에는 undefined가 저장됨)
    const status = notifyOrder('김민수', '무선 기계식 키보드');
    console.log('반환값 확인:', status); // undefined 출력
  </script>
</body>
</html>
